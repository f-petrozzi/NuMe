# Cloudflare Tunnel config for NüMe homelab deployment
#
# Prerequisites:
#   1. Install cloudflared: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/get-started/
#   2. Authenticate: cloudflared tunnel login
#   3. Create the tunnel: cloudflared tunnel create nume
#   4. Copy the tunnel ID from the output and paste it below
#   5. Add DNS routes in Cloudflare dashboard (or via CLI):
#        cloudflared tunnel route dns nome api.<your-domain>
#        cloudflared tunnel route dns nome app.<your-domain>
#   6. Run: cloudflared tunnel run nume
#
# To run as a systemd service:
#   sudo cloudflared service install
#   sudo systemctl enable --now cloudflared

tunnel: <your-tunnel-id>
credentials-file: /home/<your-username>/.cloudflared/<your-tunnel-id>.json

ingress:
  # Backend API
  - hostname: api.<your-domain>
    service: http://localhost:8000

  # Frontend (if running locally; use Cloudflare Pages URL instead if deployed there)
  - hostname: app.<your-domain>
    service: http://localhost:8080

  # Required catch-all
  - service: http_status:404
